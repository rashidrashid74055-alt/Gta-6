<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#05070c">
<title>Apex Highway</title>
</head>
<body>
<div id="app">
  <canvas id="gl"></canvas>

  <div id="hud">
    <div id="topL">
      <div id="spd"><span id="spdN">0</span><i>km/h</i></div>
      <div id="gear">N</div>
    </div>

    <div id="bars">
      <div class="bar"><b>FUEL</b><div class="track"><div id="bFuel" class="fill f"></div></div></div>
      <div class="bar"><b>HP</b><div class="track"><div id="bHp" class="fill h"></div></div></div>
      <div class="bar"><b>NITRO</b><div class="track"><div id="bNos" class="fill n"></div></div></div>
      <div class="bar"><b>DIRT</b><div class="track"><div id="bDirt" class="fill d"></div></div></div>
    </div>

    <div id="topR">
      <button class="ico" id="bCam" title="Camera">CAM</button>
      <button class="ico" id="bFull" title="Fullscreen">⛶</button>
      <button class="ico" id="bMenu" title="Menu">☰</button>
    </div>

    <div id="todChips">
      <button class="chip" data-t="0.10">DAWN</button>
      <button class="chip" data-t="0.30">DAY</button>
      <button class="chip" data-t="0.46">SUNSET</button>
      <button class="chip" data-t="0.70">NIGHT</button>
      <button class="chip on" id="bAuto">AUTO</button>
    </div>

    <div id="run">
      <div id="dist">0 m</div>
      <div id="xpwrap"><div id="xpFill"></div></div>
      <div id="lvl">LV 1</div>
    </div>

    <div id="radarWrap"><canvas id="radar" width="120" height="150"></canvas></div>

    <div id="mission"><b id="mName">—</b><div class="track"><div id="mBar" class="fill n"></div></div><span id="mTxt">0 / 0</span></div>

    <div id="eChip">E<span>SERVICE</span></div>

    <div id="pad">
      <div class="pgrp">
        <button class="pbtn" id="pL">◀</button>
        <button class="pbtn" id="pR">▶</button>
      </div>
      <div class="pgrp">
        <button class="pbtn small" id="pHand">HAND</button>
        <button class="pbtn small" id="pDrift">DRIFT</button>
        <button class="pbtn small nos" id="pNos">NOS</button>
      </div>
      <div class="pgrp col">
        <button class="pbtn acc" id="pUp">▲</button>
        <button class="pbtn" id="pDn">▼</button>
      </div>
    </div>

    <div id="flash"></div>
    <div id="toast"></div>
  </div>

  <div id="menu" class="screen">
    <header>
      <h1>APEX<span>HIGHWAY</span></h1>
      <div class="wallet">◈ <b id="credits">0</b></div>
    </header>
    <div id="garage">
      <div id="showroom"><canvas id="showGl" width="640" height="360"></canvas>
        <div id="carName">NOVA R</div>
        <div id="carCat">SPORT</div>
      </div>
      <div id="shop">
        <div id="carList"></div>
        <div id="stats"></div>
        <div id="mods"></div>
      </div>
    </div>
    <div id="menuBar">
      <button class="big" id="bPlay">DRIVE</button>
      <button class="ghost" id="bMissions">MISSIONS</button>
      <button class="ghost" id="bBuy">BUY</button>
      <button class="ghost" id="bSell">SELL</button>
    </div>
    <div id="missionsPanel" class="screen sub">
      <h2>MISSIONS</h2>
      <div id="mList"></div>
      <button class="ghost" id="bBack">BACK</button>
    </div>
  </div>

  <div id="pause" class="screen sub">
    <h2>PAUSED</h2>
    <button class="big" id="bResume">RESUME</button>
    <button class="ghost" id="bGarage">GARAGE</button>
    <button class="ghost" id="bRestart">RESTART RUN</button>
  </div>

  <div id="err"></div>
</div>

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{background:#05070c;overflow:hidden;height:100%}
  #app{
    position:relative;width:100%;height:100vh;height:100dvh;min-height:520px;
    overflow:hidden;background:#05070c;
    font-family:"Eurostile","Rajdhani",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    color:#eaf2ff;
    user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-user-drag:none;
    touch-action:none;overscroll-behavior:none;
    --acc:#3ee0ff; --hot:#ff3d6e;
  }
  canvas{display:block}
  #gl{position:absolute;inset:0;width:100%;height:100%}

  #hud{position:absolute;inset:0;pointer-events:none;
       padding:calc(8px + env(safe-area-inset-top)) calc(10px + env(safe-area-inset-right))
               calc(8px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
       opacity:0;transition:opacity .35s}
  #hud.on{opacity:1}
  #hud button{pointer-events:auto;font-family:inherit}

  #topL{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(10px + env(safe-area-inset-top));
        display:flex;align-items:flex-end;gap:8px}
  #spd{font-size:44px;font-weight:800;letter-spacing:-2px;line-height:.85;
       text-shadow:0 2px 18px #000,0 0 34px #000a;font-variant-numeric:tabular-nums}
  #spd i{font-size:11px;font-weight:600;letter-spacing:2px;opacity:.6;margin-left:4px;font-style:normal}
  #gear{font-size:15px;font-weight:800;padding:2px 7px;border-radius:5px;
        background:#3ee0ff22;border:1px solid #3ee0ff66;color:var(--acc);margin-bottom:8px}

  #bars{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(78px + env(safe-area-inset-top));
        display:flex;flex-direction:column;gap:4px;width:132px}
  .bar{display:flex;align-items:center;gap:5px}
  .bar b{font-size:7.5px;letter-spacing:1.2px;opacity:.55;width:32px;font-weight:700}
  .track{flex:1;height:5px;border-radius:3px;background:#ffffff1c;overflow:hidden}
  .fill{height:100%;width:100%;border-radius:3px;transition:width .12s linear}
  .fill.f{background:linear-gradient(90deg,#ffd166,#ffe9a8)}
  .fill.h{background:linear-gradient(90deg,#38e07b,#a8ffc9)}
  .fill.n{background:linear-gradient(90deg,#3ee0ff,#b8f4ff)}
  .fill.d{background:linear-gradient(90deg,#b0836a,#e0c3ac)}

  #topR{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(10px + env(safe-area-inset-top));
        display:flex;gap:6px}
  .ico{width:38px;height:38px;border-radius:9px;background:#0b1220bb;border:1px solid #ffffff26;
       color:#dceaff;font-size:13px;font-weight:700;letter-spacing:.5px;backdrop-filter:blur(6px)}
  .ico:active{background:#3ee0ff33;border-color:#3ee0ff88}

  #todChips{position:absolute;top:calc(56px + env(safe-area-inset-top));right:calc(10px + env(safe-area-inset-right));
            display:flex;flex-direction:column;gap:4px;align-items:flex-end}
  .chip{font-size:8px;letter-spacing:1px;padding:3px 7px;border-radius:20px;font-weight:700;
        background:#0b1220aa;border:1px solid #ffffff22;color:#c6d6ea}
  .chip.on{background:#3ee0ff;color:#04121a;border-color:#3ee0ff}

  #run{position:absolute;left:50%;transform:translateX(-50%);top:calc(8px + env(safe-area-inset-top));
       display:flex;align-items:center;gap:7px;background:#070d18aa;padding:4px 10px;border-radius:20px;
       border:1px solid #ffffff1c;backdrop-filter:blur(6px)}
  #dist{font-size:12px;font-weight:800;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  #xpwrap{width:54px;height:4px;background:#ffffff22;border-radius:3px;overflow:hidden}
  #xpFill{height:100%;width:0;background:linear-gradient(90deg,#3ee0ff,#7cf9c9)}
  #lvl{font-size:8px;font-weight:800;opacity:.65;letter-spacing:1px}

  #radarWrap{position:absolute;right:calc(10px + env(safe-area-inset-right));bottom:calc(96px + env(safe-area-inset-bottom));
             opacity:.85}
  #radar{width:72px;height:90px}

  #mission{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));
           width:min(230px,44vw);background:#070d18c4;border:1px solid #ffffff1a;border-radius:9px;
           padding:6px 9px;backdrop-filter:blur(6px)}
  #mission b{font-size:8px;letter-spacing:1.4px;opacity:.7;display:block;margin-bottom:4px;font-weight:800}
  #mission .track{height:4px}
  #mission span{font-size:7.5px;opacity:.55;display:block;margin-top:3px;font-variant-numeric:tabular-nums}

  #eChip{position:absolute;left:50%;transform:translateX(-50%) scale(.8);
         bottom:calc(66px + env(safe-area-inset-bottom));
         display:flex;align-items:center;gap:5px;padding:4px 9px 4px 4px;border-radius:20px;
         background:#3ee0ff;color:#04121a;font-weight:900;font-size:13px;
         opacity:0;transition:.18s;pointer-events:none;box-shadow:0 0 24px #3ee0ff88}
  #eChip.on{opacity:1;transform:translateX(-50%) scale(1);pointer-events:auto}
  #eChip span{font-size:8px;letter-spacing:1.4px}

  #pad{position:absolute;inset:auto 0 0 0;display:flex;justify-content:space-between;align-items:flex-end;
       padding:0 calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
       gap:8px}
  .pgrp{display:flex;gap:8px;align-items:flex-end}
  .pgrp.col{flex-direction:column;gap:6px}
  .pbtn{width:62px;height:62px;border-radius:50%;background:#0a1220c4;border:1.5px solid #ffffff2e;
        color:#e8f3ff;font-size:22px;font-weight:800;backdrop-filter:blur(7px);
        display:flex;align-items:center;justify-content:center;
        box-shadow:0 6px 22px #0008,inset 0 1px 0 #ffffff22;transition:transform .06s,background .1s}
  .pbtn:active,.pbtn.act{background:#3ee0ff38;border-color:#3ee0ff;transform:scale(.94)}
  .pbtn.small{width:48px;height:48px;font-size:8px;letter-spacing:1px;border-radius:14px}
  .pbtn.nos{color:#9fe9ff;border-color:#3ee0ff66}
  .pbtn.acc{width:76px;height:76px;background:#12e08a2e;border-color:#12e08a99;color:#c9ffe8}

  #flash{position:absolute;inset:0;background:#ff2b4d;opacity:0;pointer-events:none;transition:opacity .2s}
  #toast{position:absolute;left:50%;top:36%;transform:translate(-50%,-50%) scale(.9);
         font-size:17px;font-weight:900;letter-spacing:2px;text-align:center;
         text-shadow:0 3px 22px #000;opacity:0;transition:.25s;pointer-events:none}
  #toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

  .screen{position:absolute;inset:0;background:#04070ddd;backdrop-filter:blur(9px);
          display:none;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 14px calc(10px + env(safe-area-inset-bottom));
          z-index:5}
  .screen.on{display:flex}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  h1{font-size:19px;letter-spacing:4px;font-weight:900}
  h1 span{color:var(--acc);margin-left:6px;font-weight:300}
  .wallet{font-size:13px;font-weight:800;color:#ffd166}
  #garage{flex:1;display:flex;gap:10px;min-height:0}
  #showroom{flex:1.15;position:relative;border-radius:12px;overflow:hidden;
            background:radial-gradient(120% 90% at 50% 30%,#16233a,#050a12 70%);
            border:1px solid #ffffff18;display:flex;align-items:center;justify-content:center}
  #showGl{width:100%;height:100%;object-fit:contain}
  #carName{position:absolute;left:12px;bottom:26px;font-size:17px;font-weight:900;letter-spacing:2px}
  #carCat{position:absolute;left:12px;bottom:12px;font-size:8px;letter-spacing:2px;color:var(--acc);opacity:.8}
  #shop{flex:1;display:flex;flex-direction:column;gap:7px;min-width:0}
  #carList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px;padding-right:2px}
  .carItem{padding:7px 8px;border-radius:8px;background:#ffffff0d;border:1px solid #ffffff14;
           font-size:10px;font-weight:700;letter-spacing:.6px;display:flex;justify-content:space-between;gap:6px}
  .carItem.sel{border-color:var(--acc);background:#3ee0ff1f}
  .carItem.lock{opacity:.42}
  .carItem b{font-weight:800}
  .carItem i{font-style:normal;font-size:8px;opacity:.7}
  #stats{display:grid;grid-template-columns:1fr 1fr;gap:4px 8px;font-size:8px;letter-spacing:.8px;opacity:.85}
  .st{display:flex;flex-direction:column;gap:2px}
  .st .track{height:4px}
  #mods{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .modBtn{font-size:8px;letter-spacing:.6px;padding:5px 4px;border-radius:6px;background:#ffffff12;
          border:1px solid #ffffff20;color:#dbe9f7;font-weight:700}
  .modBtn:active{background:#3ee0ff2e}
  #menuBar{display:flex;gap:7px;margin-top:9px}
  .big{flex:2;padding:14px;border-radius:11px;background:linear-gradient(100deg,#12e08a,#3ee0ff);
       color:#03121a;font-weight:900;letter-spacing:3px;font-size:14px;border:0}
  .big:active{filter:brightness(.9)}
  .ghost{flex:1;padding:13px;border-radius:11px;background:#ffffff10;border:1px solid #ffffff24;
         color:#dbe9f7;font-weight:800;letter-spacing:1.4px;font-size:10px}
  .ghost:active{background:#ffffff22}
  .sub{z-index:9;background:#04070df2}
  h2{font-size:15px;letter-spacing:3px;margin-bottom:10px}
  #mList{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
  .mRow{background:#ffffff0d;border:1px solid #ffffff16;border-radius:9px;padding:8px}
  .mRow b{font-size:9.5px;letter-spacing:1px;display:block;margin-bottom:5px}
  .mRow .track{height:5px;margin-bottom:5px}
  .mRow span{font-size:8px;opacity:.6}
  .mRow.done{border-color:#12e08a66}
  .mRow button{margin-top:6px;width:100%;padding:6px;border-radius:6px;border:0;font-size:8px;
               font-weight:800;letter-spacing:1.4px;background:#12e08a;color:#04121a}
  #pause{gap:8px;align-items:stretch;justify-content:center}
  #pause .big{flex:0}
  #err{position:absolute;inset:auto 0 0 0;max-height:45%;overflow:auto;background:#3a0b12ee;
       color:#ffd9de;font:11px/1.45 ui-monospace,monospace;padding:9px;display:none;z-index:20;
       border-top:1px solid #ff5d7a;white-space:pre-wrap}
  @media (max-height:430px){
    #spd{font-size:34px}
    .pbtn{width:52px;height:52px}
    .pbtn.acc{width:62px;height:62px}
    .pbtn.small{width:42px;height:42px}
    #mission{bottom:calc(4px + env(safe-area-inset-bottom))}
  }
</style>

<script>
window.__errs=0;
function showErr(m){
  __errs++; const el=document.getElementById('err');
  el.style.display='block'; el.textContent+=(el.textContent?'\n':'')+'⚠ '+m;
}
window.addEventListener('error',e=>showErr((e.message||'error')+'  @line '+(e.lineno||'?')));
window.addEventListener('unhandledrejection',e=>showErr('promise: '+(e.reason&&e.reason.message||e.reason)));

const CDN=[
  'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
  'https://unpkg.com/three@0.128.0/build/three.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
];
(function load(i){
  if(i>=CDN.length){showErr('three.js could not be loaded — check connection');return}
  const s=document.createElement('script');
  s.src=CDN[i];
  s.onload=()=>{try{boot()}catch(e){showErr(e.message)}};
  s.onerror=()=>load(i+1);
  document.head.appendChild(s);
})(0);

function boot(){
'use strict';
const $=s=>document.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const fmt=n=>Math.round(n).toLocaleString('en-US');

const KEY='apex_highway_save_v7';
const DEF={
  v:7,level:1,xp:0,credits:400,owned:['nova_r'],selected:'nova_r',mods:{},
  settings:{master:.65,engine:.7,quality:'auto',shake:true,cam:0},
  missions:[],daily:[],dailyDate:'',best:0,runs:0,total:0
};
let S;
try{S=Object.assign({},DEF,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){S=Object.assign({},DEF)}
if(!S.owned||!S.owned.length)S.owned=['nova_r'];
if(!S.settings)S.settings=Object.assign({},DEF.settings);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};

const CARS=[
  {id:'nova_r',name:'NOVA R',cat:'SPORT',lvl:1,price:0,col:0x2f7dff,st:{a:8,t:7,h:7,b:7,f:7,d:6,n:6},shape:'coupe'},
  {id:'vanta',name:'VANTA GT',cat:'SPORT',lvl:2,price:2600,col:0xd8dde3,st:{a:8.4,t:7.4,h:7.2,b:7.2,f:6.8,d:6,n:6.4},shape:'coupe'},
  {id:'kiro_s',name:'KIRO S',cat:'MUSCLE',lvl:3,price:4200,col:0xc9302c,st:{a:9.2,t:7.8,h:6.6,b:6.8,f:6.4,d:5.8,n:7},shape:'muscle'},
  {id:'kestrel',name:'KESTREL 4S',cat:'SEDAN',lvl:4,price:5600,col:0x1d2a3a,st:{a:8.6,t:8,h:7.4,b:8,f:8.6,d:8,n:6.6},shape:'sedan'},
  {id:'lynx_x',name:'LYNX X',cat:'SUV',lvl:5,price:7400,col:0x35414d,st:{a:8.2,t:8.2,h:7,b:8.2,f:9,d:9,n:7.2},shape:'suv'},
  {id:'corv_a',name:'CORVA AERO',cat:'SUPER',lvl:7,price:11500,col:0xffb02e,st:{a:9.4,t:8.6,h:8.2,b:8.4,f:7,d:6.4,n:8},shape:'super'},
  {id:'strada',name:'STRADA V12',cat:'SUPER',lvl:9,price:15800,col:0xd41f1f,st:{a:9.6,t:8.9,h:8.4,b:8.6,f:6.8,d:6.2,n:8.2},shape:'super'},
  {id:'manta',name:'MANTA 720',cat:'SUPER',lvl:11,price:19400,col:0xff7a18,st:{a:9.7,t:9,h:8.8,b:8.8,f:6.6,d:6,n:8.6},shape:'hyper'},
  {id:'toro',name:'TORO SV',cat:'HYPER',lvl:13,price:26000,col:0x63d34a,st:{a:9.9,t:9.3,h:8.6,b:9,f:6.4,d:6,n:8.8},shape:'hyper'},
  {id:'noir',name:'NOIR 900',cat:'HYPER',lvl:15,price:32000,col:0x14161c,st:{a:10,t:9.5,h:8.8,b:9.2,f:6.2,d:5.8,n:9},shape:'hyper'},
  {id:'pura',name:'PURA S',cat:'HYPER',lvl:17,price:38000,col:0xf2f4f8,st:{a:9.9,t:9.6,h:9.2,b:9.2,f:6,d:5.6,n:9.2},shape:'hyper'},
  {id:'gtr_x',name:'GTR-X',cat:'SUPER',lvl:19,price:44000,col:0x8a9bb0,st:{a:10,t:9.4,h:9,b:9.4,f:6.2,d:6,n:9},shape:'super'},
  {id:'aero_w',name:'AERO WRAITH',cat:'HYPER',lvl:22,price:52000,col:0x2a4a8c,st:{a:10,t:9.7,h:9.4,b:9.5,f:6,d:5.6,n:9.4},shape:'hyper'},
  {id:'gale',name:'GALE F1',cat:'HYPER',lvl:25,price:64000,col:0xff2d55,st:{a:10,t:9.9,h:9.6,b:9.6,f:6,d:5.4,n:9.6},shape:'hyper'},
  {id:'vesper',name:'VESPER ONE',cat:'HYPER',lvl:29,price:80000,col:0x1d8f8a,st:{a:10,t:10,h:9.8,b:9.8,f:6,d:5.2,n:9.8},shape:'hyper'},
  {id:'apex',name:'APEX ZERO',cat:'HYPER',lvl:34,price:120000,col:0xe8dcc0,st:{a:10,t:10,h:10,b:10,f:6.2,d:5.4,n:10},shape:'hyper'}
];
const CAR=id=>CARS.find(c=>c.id===id)||CARS[0];

const MODS=[
  {id:'eng',name:'ENGINE'},{id:'turbo',name:'TURBO'},{id:'tyre',name:'TYRES'},
  {id:'brake',name:'BRAKES'},{id:'tank',name:'FUEL TANK'},{id:'armor',name:'ARMOUR'}
];
const modLv=id=>(S.mods[S.selected]||{})[id]||0;
const modCost=(id,lv)=>Math.round(320*Math.pow(1.55,lv));
const stat=()=>{
  const c=CAR(S.selected); const m=S.mods[S.selected]||{};
  const g=k=>m[k]||0;
  return{
    a:c.st.a+g('eng')*.55+g('turbo')*.5,
    t:c.st.t+g('eng')*.3+g('turbo')*.42,
    h:c.st.h+g('tyre')*.5,
    b:c.st.b+g('brake')*.5,
    f:c.st.f+g('tank')*.7,
    d:c.st.d+g('armor')*.6,
    n:c.st.n
  };
};
const lvlNeed=l=>Math.round(240+l*175);

function envCube(){

    const c=document.createElement('canvas'); c.width=c.height=64;

}

const C_=h=>new THREE.Color(h);
const PAL={top:new THREE.Color(),mid:new THREE.Color(),hor:new THREE.Color(),
  sun:new THREE.Color(),dirC:new THREE.Color(),fogC:new THREE.Color(),
  amb:0,dir:1,fog:.1,star:0};
function palAt(t){
  t=((t%1)+1)%1;
  let i=0; while(i<SKY_KEYS.length-2&&SKY_KEYS[i+1].t<=t)i++;
  const a=SKY_KEYS[i],b=SKY_KEYS[i+1];
  const k=clamp((t-a.t)/Math.max(1e-4,b.t-a.t),0,1);
  PAL.top.copy(C_(a.top)).lerp(C_(b.top),k);
  PAL.mid.copy(C_(a.mid)).lerp(C_(b.mid),k);
  PAL.hor.copy(C_(a.hor)).lerp(C_(b.hor),k);
  PAL.sun.copy(C_(a.sun)).lerp(C_(b.sun),k);
  PAL.dirC.copy(C_(a.dirC)).lerp(C_(b.dirC),k);
  PAL.fogC.copy(C_(a.fogC)).lerp(C_(b.fogC),k);
  PAL.amb=lerp(a.amb,b.amb,k); PAL.dir=lerp(a.dir,b.dir,k);
  PAL.fog=lerp(a.fog,b.fog,k); PAL.star=lerp(a.star,b.star,k);
}

const skyMat=new THREE.ShaderMaterial({
  side:THREE.BackSide,depthWrite:false,fog:false,
  uniforms:{
    topC:{value:new THREE.Color(0x1a5fc9)},midC:{value:new THREE.Color(0x5ea5ef)},
    horC:{value:new THREE.Color(0xcbe6ff)},sunC:{value:new THREE.Color(0xffffff)},
    sunDir:{value:new THREE.Vector3(0,1,0)},starA:{value:0},sunA:{value:1}
  },
  vertexShader:`varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader:`
    varying vec3 vD; uniform vec3 topC,midC,horC,sunC,sunDir; uniform float starA,sunA;
    float h(vec3 p){ return fract(sin(dot(p,vec3(12.9898,78.233,45.164)))*43758.5453); }
    void main(){
      float y=clamp(vD.y,-1.,1.);
      vec3 col=mix(horC,midC,smoothstep(-.02,.34,y));
      col=mix(col,topC,smoothstep(.22,.86,y));
      float d=max(dot(normalize(vD),normalize(sunDir)),0.);
      col+=sunC*pow(d,26.)*.85*sunA;
      col+=sunC*pow(d,4.)*.18*sunA;
      vec3 sp=floor(vD*260.);
      float s=h(sp);
      float tw=step(.9975,s)*(1.-smoothstep(.05,.5,y));
      col+=vec3(tw)*starA*1.6;
      gl_FragColor=vec4(col,1.);
    }`
});

function bodyGeo(shape){
  if(GEO[shape])return GEO[shape];
  const sp=SPEC[shape];
  const sh=new THREE.Shape();
  const p=PROF[shape];
  sh.moveTo(p[0][0],p[0][1]);
  for(let i=1;i<p.length;i++)sh.lineTo(p[i][0],p[i][1]);
  sh.lineTo(p[0][0],p[0][1]);
  const g=new THREE.ExtrudeGeometry(sh,{depth:sp.w-.14,bevelEnabled:true,bevelThickness:.07,
    bevelSize:.07,bevelSegments:3,curveSegments:6});
  g.rotateY(-Math.PI/2);
  g.translate(sp.w/2,0,0);
  g.computeVertexNormals();
  GEO[shape]=g; return g;
}
function cabinGeo(shape){
  if(GGEO[shape])return GGEO[shape];
  const sp=SPEC[shape], w=sp.w*.8;
  const h=shape==='suv'?1.52:shape==='sedan'?1.26:1.04;
  const sh=new THREE.Shape();
  const x0=-.75,x1=1.55;
  sh.moveTo(x0,h*.72); sh.lineTo(x0+.3,h); sh.lineTo(x1-.5,h); sh.lineTo(x1,h*.68);
  sh.lineTo(x1,h*.6); sh.lineTo(x0,h*.62); sh.lineTo(x0,h*.72);
  const g=new THREE.ExtrudeGeometry(sh,{depth:w-.1,bevelEnabled:true,bevelThickness:.05,bevelSize:.05,bevelSegments:2});
  g.rotateY(-Math.PI/2); g.translate(w/2,0,0); g.computeVertexNormals();
  GGEO[shape]=g; return g;
}

function buildCar(shape,col){
  const sp=SPEC[shape];
  const g=new THREE.Group();
  const own=[];
  const P=paint(col); own.push(P);

  const body=new THREE.Mesh(bodyGeo(shape),P);
  body.castShadow=true; body.receiveShadow=true; g.add(body);
  g.add(new THREE.Mesh(cabinGeo(shape),M.glass));

  const tireG=new THREE.CylinderGeometry(sp.wr,sp.wr,.3,16); tireG.rotateZ(Math.PI/2);
  const rimG=new THREE.CylinderGeometry(sp.wr*.6,sp.wr*.6,.32,12); rimG.rotateZ(Math.PI/2);
  const wheels=[];
  for(const sx of [-1,1])for(const sz of [-1,1]){
    const wg=new THREE.Group();
    const t=new THREE.Mesh(tireG,M.tyre); t.castShadow=true;
    wg.add(t,new THREE.Mesh(rimG,M.rim));
    wg.position.set(sx*(sp.w/2-.02),sp.wr,sz*sp.wz);
    g.add(wg); wheels.push(wg);
  }
  const hlG=new THREE.BoxGeometry(.4,.1,.08);
  for(const sx of [-1,1]){
    const hl=new THREE.Mesh(hlG,M.white);
    hl.position.set(sx*(sp.w/2-.36),.55,-2.05*(sp.wz/1.5));
    g.add(hl);
  }
  const tl=new THREE.Mesh(new THREE.BoxGeometry(sp.w*.62,.09,.07),M.red);
  tl.position.set(0,.62,2.2*(sp.wz/1.5)); g.add(tl);

  const mg=new THREE.BoxGeometry(.2,.09,.12);
  for(const sx of [-1,1]){
    const m=new THREE.Mesh(mg,P);
    m.position.set(sx*(sp.w/2+.03),1.0,-.55); g.add(m);
  }
  if(shape==='super'||shape==='hyper'){
    const wing=new THREE.Mesh(new THREE.BoxGeometry(sp.w*.86,.06,.34),M.dark);
    wing.position.set(0,1.16,2.0); wing.castShadow=true; g.add(wing);
    for(const sx of [-1,1]){
      const st=new THREE.Mesh(new THREE.BoxGeometry(.07,.22,.1),M.dark);
      st.position.set(sx*sp.w*.34,1.05,2.0); g.add(st);
    }
  }
  const blob=new THREE.Mesh(SHADOWGEO,SHADOWMAT);
  blob.rotation.x=-Math.PI/2; blob.scale.set(sp.w*1.5,3.6,1);
  blob.position.y=.02; g.add(blob);

  g.userData.wheels=wheels; g.userData.own=own;
  return g;
}

function audioInit(){

    eng=AC.createOscillator(); eng.type='sawtooth'; eng.frequency.value=60;
    engGain=AC.createGain(); engGain.gain.value=0;
    const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=760;
    eng.connect(lp); lp.connect(engGain); engGain.connect(AC.destination); eng.start();
    nosOsc=AC.createOscillator(); nosOsc.type='triangle'; nosOsc.frequency.value=1400;
    const ng=AC.createGain(); ng.gain.value=0; nosOsc.connect(ng); ng.connect(AC.destination); nosOsc.start();
    nosOsc.userData={g:ng};
  }catch(e){}
}

function rollMission(){
  const used=S.daily.map(m=>m.id);
  const pool=MISSION_POOL.filter(m=>!used.includes(m.id));
  const base=pool.length?pick(pool):pick(MISSION_POOL);
  const scale=1+(S.level-1)*.12;
  mission={...base,need:Math.round(base.need*scale),done:false};
  missionProg=0;
  H.mName.textContent=mission.name; H.mTxt.textContent='0 / '+mission.need;
  H.mBar.style.width='0%'; H.mBar.style.background='';
}
function progMission(v){
  if(!mission||mission.done)return;
  missionProg+=v;
  H.mBar.style.width=Math.min(100,missionProg/mission.need*100)+'%';
  H.mTxt.textContent=fmt(missionProg)+' / '+fmt(mission.need);
  if(missionProg>=mission.need){
    mission.done=true;
    addXp(mission.xp); S.credits+=mission.cr; save();
    toast('MISSION COMPLETE +'+mission.cr+'◈');
    H.mBar.style.background='#12e08a';
    setTimeout(rollMission,2400);
  }
}

function cycleCam(){camMode=(camMode+1)%4;S.settings.cam=camMode;save()}
const camPos=new THREE.Vector3(),camLook=new THREE.Vector3();
function updateCam(dt){
  const sp=clamp(P.speed/70,0,1);
  const back=lerp(7.2,9.4,sp), up=lerp(2.7,3.5,sp);
  if(camMode===0){
    camPos.set(P.lat*.35+Math.sin(P.yaw)*2.2,up,P.z+back*Math.cos(P.yaw));
    camLook.set(P.lat*1.1,1.0,P.z-9);
  }else if(camMode===1){
    camPos.set(P.lat,1.35,P.z+2.2); camLook.set(P.lat*1.2,1.1,P.z-20);
  }else if(camMode===2){
    camPos.set(P.lat*.5,6.2,P.z+13); camLook.set(P.lat,.8,P.z-14);
  }else{
    const a=performance.now()*.0002;
    camPos.set(P.lat+Math.sin(a)*13,4.2,P.z+Math.cos(a)*13);
    camLook.set(P.lat,1,P.z);
  }
  if(shake>0){
    camPos.x+=rand(-shake,shake); camPos.y+=rand(-shake,shake); shake*=Math.pow(.02,dt);
  }
  camera.position.lerp(camPos,1-Math.pow(.001,dt));
  camera.lookAt(camLook);
  const fov=lerp(66,76,sp)+(P.nitro?6:0);
  if(Math.abs(camera.fov-fov)>.4){camera.fov=lerp(camera.fov,fov,.1);camera.updateProjectionMatrix()}
}

function updateTraffic(dt){
  for(let i=traffic.length-1;i>=0;i--){
    const t=traffic[i];
    t.m.position.z+=t.sp*dt;
    t.m.userData.wheels.forEach(w=>w.rotation.x-=t.sp*dt*2.4);
    if(t.m.position.z>P.z+70){killTraffic(i);continue}
    const dz=t.m.position.z-P.z;
    if(dz>-2.4&&dz<2.4){
      const dx=Math.abs(t.m.position.x-P.lat);
      if(dx<1.85){
        if(P.invuln<=0){
          P.hp=clamp(P.hp-Math.max(4,Math.abs(P.speed-t.sp)*.55),0,100);
          P.speed*=.62; P.invuln=.85; shake=.5;
          H.flash.style.opacity=.5; setTimeout(()=>H.flash.style.opacity=0,180);
          toast('CRASH');
        }
      }else if(dx<3.3&&!t.counted){
        t.counted=true; nearMisses++; progMission(1); runCredits+=8;
      }
    }
    if(dz<-1&&dz>-9&&!t.passed){
      t.passed=true; progMission(1); runCredits+=12;
    }
  }
}

function update(dt){
  const st=stat();
  P.invuln=Math.max(0,P.invuln-dt);

  const maxMs=(150+st.t*17)/KMH;
  let acc=0;
  if(keys.up){
    acc=(1.6+st.a*.72)*(P.nitro?2.35:1);
    if(P.fuel>0)P.fuel=Math.max(0,P.fuel-dt*(P.nitro?2.6:.85));
  }
  if(keys.dn){
    if(P.speed>.6)P.speed-=dt*(5.2+st.b*.5);
    else{P.speed-=dt*4.2;if(P.speed<-8)P.speed=-8}
  }
  P.speed+=acc*dt;
  if(!keys.up&&P.speed>0)P.speed-=dt*(1.1+P.dirt*.012);
  if(P.speed>maxMs)P.speed=lerp(P.speed,maxMs,.6);

  P.nitro=!!keys.nos&&P.nos>0&&P.speed>2&&P.fuel>0;
  if(P.nitro){P.nos=Math.max(0,P.nos-dt*11);progMission(dt)}
  else P.nos=Math.min(100,P.nos+dt*3.4);

  P.hand=!!keys.hand;

  const sIn=(keys.r?1:0)-(keys.l?1:0);
  P.steer=lerp(P.steer,sIn,.16);
  const spdK=clamp(P.speed/26,0,1);
  const turn=(.5+st.h*.085)*(1-spdK*.34);
  P.lat+=P.steer*turn*dt*8*(P.speed>1?1:.6);
  P.lat=clamp(P.lat,-(ROAD_W/2-1.6),ROAD_W/2-1.6);

  const targetDrift=P.hand?P.steer*.5:(keys.drift&&Math.abs(P.speed)>18?P.stear=.34:0);
  P.drift=lerp(P.drift,targetDrift,.12);
  P.yaw=lerp(P.yaw,P.steer*.055*(P.speed/maxMs)*1.8,.1);

  const v=Math.abs(P.speed);
  P.z-=P.speed*dt;
  dist+=v*dt;
  topSpeed=Math.max(topSpeed,v*KMH);
  if(P.speed>0)progMission(v*dt);

  player.position.set(P.lat,0,P.z);
  player.rotation.y=P.yaw;
  player.rotation.z=lerp(player.rotation.z,-P.steer*.045*(P.speed/maxMs),.1);
  if(playerCar){
    playerCar.rotation.y=-P.drift*.34;
    playerCar.userData.wheels.forEach(w=>w.rotation.x-=P.speed*dt*2.2);
  }

  if(P.speed>0)P.dirt=Math.min(100,P.dirt+dt*(.35+P.speed*.012));
  if(P.fuel<=0)P.speed=Math.max(0,P.speed-dt*3);

  for(const c of chunks){
    if(c.position.z>P.z+CHUNK*2)c.position.z-=SPAN;
    else if(c.position.z<P.z-SPAN+CHUNK*2)c.position.z+=SPAN;
  }
  if(Math.random()<dt*1.6)spawnTraffic(P.z-230);
  if(Math.random()<dt*.06)spawnStation(P.z-260);

  updateTraffic(dt);
  updateStations();

  const kmh=Math.abs(P.speed*KMH);
  H.spd.textContent=Math.round(kmh);
  H.gear.textContent=P.speed<-1?'R':P.speed<1?'N':String(Math.min(7,1+Math.floor(kmh/38)));
  H.fuel.style.width=P.fuel+'%';
  H.hp.style.width=P.hp+'%';
  H.nos.style.width=P.nos+'%';
  H.dirt.style.width=P.dirt+'%';
  H.dist.textContent=fmt(dist)+' m';
  H.lvl.textContent='LV '+S.level;
  H.xp.style.width=(S.xp/lvlNeed(S.level)*100)+'%';
  drawRadar();

  if(P.hp<=0){toast('WRECKED');endRun()}
}

const rctx=H.radar.getContext('2d');
function drawRadar(){
  const w=120,h=150;
  rctx.clearRect(0,0,w,h);
  rctx.fillStyle='#050c14cc'; rctx.fillRect(0,0,w,h);
  rctx.strokeStyle='#3ee0ff44'; rctx.lineWidth=1; rctx.strokeRect(.5,.5,w-1,h-1);
  const cx=w/2, cy=h*.82, sc=1.6;
  rctx.strokeStyle='#ffffff18';
  for(const l of LANES){rctx.beginPath();rctx.moveTo(cx+l*sc,0);rctx.lineTo(cx+l*sc,h);rctx.stroke()}
  rctx.fillStyle='#3ee0ff';
  rctx.beginPath(); rctx.moveTo(cx+P.lat*sc,cy); rctx.lineTo(cx+P.lat*sc-4,cy+8); rctx.lineTo(cx+P.lat*sc+4,cy+8); rctx.fill();
  for(const t of traffic){
    const y=cy-(t.m.position.z-P.z)*sc;
    if(y<-6||y>h+6)continue;
    rctx.fillStyle='#ff5d7a'; rctx.fillRect(cx+t.m.position.x*sc-3,y-5,6,10);
  }
  for(const s of stations){
    const y=cy-(s.z-P.z)*sc;
    if(y<-6||y>h+6)continue;
    rctx.fillStyle=s.kind==='fuel'?'#ffc14d':'#54e08a';
    rctx.fillRect(2,y-3,5,6);
  }
}

const tmpC=new THREE.Color();
function updateSky(dt){
  if(W.auto){W.tod+=dt*.0042; if(W.tod>1)W.tod-=1}
  else W.tod=lerp(W.tod,W.todT,.05);
  palAt(W.tod);
  const night=isNight(W.tod)?1:0;
  W.night=!!night;

  const a=W.tod*Math.PI*2-Math.PI/2, sy=Math.sin(a);
  const sunDir=new THREE.Vector3(Math.cos(a)*.7,Math.max(-.35,sy),Math.cos(a)*.35+.35).normalize();
  skyMat.uniforms.sunDir.value.copy(sunDir);
  skyMat.uniforms.topC.value.copy(PAL.top);
  skyMat.uniforms.midC.value.copy(PAL.mid);
  skyMat.uniforms.horC.value.copy(PAL.hor);
  skyMat.uniforms.sunC.value.copy(PAL.sun);
  skyMat.uniforms.starA.value=PAL.star;
  starMat.opacity=PAL.star;
  skyMat.uniforms.sunA.value=clamp(sy*2.4+.15,0,1);

  sunSpr.position.copy(sunDir).multiplyScalar(1300);
  sunSpr.material.color.copy(PAL.sun);
  sunSpr.material.opacity=clamp(sy*2.6+.1,0,1);

  scene.fog.color.copy(PAL.fogC);
  scene.fog.near=lerp(90,26,PAL.fog*1.5);
  scene.fog.far=lerp(560,190,PAL.fog*1.6);

  const dayK=clamp(PAL.amb/.86,0,1);
  hemi.intensity=lerp(.22,1.0,dayK);
  hemi.color.copy(PAL.mid);
  sun.intensity=PAL.dir;
  sun.color.copy(PAL.dirC);
  sun.target.position.set(P.lat,0,P.z);
  sun.position.set(P.lat+sunDir.x*60,sunDir.y*70+14,P.z+sunDir.z*60);
  renderer.toneMappingExposure=lerp(.62,1.06,dayK);

  for(const c of clouds){
    c.userData.a+=c.userData.sp*dt;
    c.position.x=Math.cos(c.userData.a)*c.userData.r;
    c.position.z=Math.sin(c.userData.a)*c.userData.r;
    c.material.color.copy(PAL.mid).lerp(tmpC.setHex(0xffffff),.55);
    c.material.opacity=lerp(.26,.82,dayK);
  }

  for(let i=0;i<bldWinMats.length;i++)bldWinMats[i].emissiveIntensity=night?.95:.12;
  for(const c of chunks){
    if(c.userData.lamps)for(const m of c.userData.lamps)m.emissiveIntensity=night?2.4:.05;
  }
  beams.userData.mat.opacity=night?.14:0;
  pl.intensity=night?1.6:0;
}

let lastTs=performance.now();
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-lastTs)/1000)||0;
  lastTs=ts;
  if(running&&!paused){update(dt);updateCam(dt);audioUpdate()}
  else updateSky(dt*.5);
  if(running)updateSky(dt);
  skyRoot.position.copy(camera.position);
  renderer.render(scene,camera);
}
requestAnimationFrame(frame);

function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio||1,LOW?1.2:1.9));
  renderer.setSize(w,h,false);
  camera.aspect=w/h;
  camera.fov=w/h<1?78:66;
  camera.updateProjectionMatrix();
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,220));

const app=$('#app');
$('#bFull').addEventListener('click',async()=>{
  try{
    if(!document.fullscreenElement){
      await (app.requestFullscreen?app.requestFullscreen():app.webkitRequestFullscreen());
      if(screen.orientation&&screen.orientation.lock)await screen.orientation.lock('landscape').catch(()=>{});
    }else await document.exitFullscreen();
    setTimeout(resize,280);
  }catch(e){toast('FULLSCREEN BLOCKED')}
});
$('#bCam').addEventListener('click',cycleCam);
$('#bMenu').addEventListener('click',togglePause);

function togglePause(){
  if(!running)return;
  paused=!paused;
  $('#pause').classList.toggle('on',paused);
  for(const k in keys)keys[k]=0;
}
$('#bResume').addEventListener('click',togglePause);
$('#bGarage').addEventListener('click',()=>{paused=false;$('#pause').classList.remove('on');endRun()});
$('#bRestart').addEventListener('click',()=>{paused=false;startRun()});

document.querySelectorAll('#todChips .chip[data-t]').forEach(b=>{
  b.addEventListener('click',()=>{W.auto=false;$('#bAuto').classList.remove('on');W.todT=+b.dataset.t});
});
$('#bAuto').addEventListener('click',()=>{W.auto=true;$('#bAuto').classList.add('on')});

let shown=CARS[0];
function renderGarage(){
  const list=$('#carList'); list.innerHTML='';
  CARS.forEach(c=>{
    const owned=S.owned.includes(c.id);
    const d=document.createElement('div');
    d.className='carItem'+(S.selected===c.id?' sel':'')+(owned?'':' lock');
    d.innerHTML='<b>'+c.name+'</b><i>'+(owned?(S.selected===c.id?'IN USE':'OWNED'):'LV '+c.lvl)+'</i>';
    d.onclick=()=>{
      if(owned){S.selected=c.id;save();renderGarage()}
      else if(S.level>=c.lvl&&S.credits>=c.price){S.credits-=c.price;S.owned.push(c.id);S.selected=c.id;save();toast('BOUGHT '+c.name);renderGarage()}
      else toast(S.level<c.lvl?'NEED LV '+c.lvl:'NOT ENOUGH ◈');
    };
    list.appendChild(d);
  });
  shown=CAR(S.selected);
  $('#carName').textContent=shown.name;
  $('#carCat').textContent=shown.cat;
  $('#credits').textContent=fmt(S.credits);

  const st=stat();
  $('#stats').innerHTML=[['ACCEL',st.a/11],['TOP',st.t/11],['HANDLE',st.h/11],['BRAKE',st.b/11],['FUEL',st.f/11],['ARMOUR',st.d/11]]
    .map(([n,v])=>'<div class="st"><span>'+n+'</span><div class="track"><div class="fill n" style="width:'+Math.min(100,v*100)+'%"></div></div></div>').join('');

  const md=$('#mods'); md.innerHTML='';
  MODS.forEach(m=>{
    const lv=modLv(m.id);
    const b=document.createElement('button');
    b.className='modBtn'; b.textContent=m.name+' '+(lv?'LV'+lv:'')+' ◈'+fmt(modCost(m.id,lv));
    b.onclick=()=>{
      const cost=modCost(m.id,lv);
      if(lv>=5)return toast('MAX');
      if(S.credits<cost)return toast('NOT ENOUGH ◈');
      S.credits-=cost; S.mods[S.selected]=S.mods[S.selected]||{}; S.mods[S.selected][m.id]=lv+1;
      save(); renderGarage();
    };
    md.appendChild(b);
  });

  $('#bBuy').textContent=S.owned.includes(shown.id)?'OWNED':'BUY ◈'+fmt(shown.price);
  $('#bSell').textContent='SELL';
}

let showR=0;
function showLoop(){
  requestAnimationFrame(showLoop);
  if(!$('#menu').classList.contains('on'))return;
  showR+=.01;
  const c=$('#showGl'), x=c.getContext('2d');
  x.clearRect(0,0,640,360);
  const g=x.createRadialGradient(320,150,20,320,150,300);
  g.addColorStop(0,'#2a3f5e'); g.addColorStop(1,'#070c14');
  x.fillStyle=g; x.fillRect(0,0,640,360);
  drawCarSprite(x,320,215,shown,showR);
}
function drawCarSprite(x,cx,cy,car,ang){
  const col='#'+car.col.toString(16).padStart(6,'0');
  x.save(); x.translate(cx,cy);
  x.fillStyle='#00000066';
  x.beginPath(); x.ellipse(0,30,150,18,0,0,7); x.fill();
  x.rotate(Math.sin(ang)*.03);
  const sh=x.createLinearGradient(0,-40,0,40);
  sh.addColorStop(0,'#ffffff55'); sh.addColorStop(.4,col); sh.addColorStop(1,'#00000088');
  x.fillStyle=sh;
  x.beginPath();
  x.moveTo(-150,10); x.quadraticCurveTo(-158,-14,-120,-22);
  x.lineTo(-40,-30); x.quadraticCurveTo(0,-58,60,-56);
  x.quadraticCurveTo(120,-52,150,-24); x.quadraticCurveTo(162,-10,158,10);
  x.quadraticCurveTo(120,22,0,22); x.quadraticCurveTo(-120,22,-150,10);
  x.fill();
  x.fillStyle='#0c1420';
  x.beginPath(); x.moveTo(-46,-30); x.quadraticCurveTo(0,-56,58,-54); x.lineTo(96,-30); x.closePath(); x.fill();
  x.fillStyle='#0a0d12';
  for(const wx of [-96,96]){x.beginPath();x.ellipse(wx,12,26,26,0,0,7);x.fill()}
  x.fillStyle='#c9d4e0';
  for(const wx of [-96,96]){x.beginPath();x.ellipse(wx,12,12,12,0,0,7);x.fill()}
  x.fillStyle='#fff7d6'; x.fillRect(-156,-16,14,8); x.fillRect(142,-16,14,8);
  x.fillStyle='#ff2d4d'; x.fillRect(-150,-4,300,5);
  x.restore();
}
showLoop();

$('#bPlay').addEventListener('click',startRun);
$('#bMissions').addEventListener('click',()=>{$('#missionsPanel').classList.add('on');renderMissions()});
$('#bBack').addEventListener('click',()=>$('#missionsPanel').classList.remove('on'));
$('#bBuy').addEventListener('click',()=>{
  const c=shown;
  if(S.owned.includes(c.id))return toast('ALREADY OWNED');
  if(S.level<c.lvl)return toast('NEED LEVEL '+c.lvl);
  if(S.credits<c.price)return toast('NOT ENOUGH ◈');
  S.credits-=c.price; S.owned.push(c.id); S.selected=c.id; save(); renderGarage(); toast('BOUGHT');
});
$('#bSell').addEventListener('click',()=>{
  const c=shown;
  if(!S.owned.includes(c.id)||S.owned.length<2)return toast('CANNOT SELL');
  S.owned=S.owned.filter(i=>i!==c.id);
  S.credits+=Math.round(c.price*.6);
  if(S.selected===c.id)S.selected=S.owned[0];
  save(); renderGarage(); toast('SOLD');
});
function renderMissions(){
  const l=$('#mList'); l.innerHTML='';
  if(!S.daily.length){
    for(let i=0;i<4;i++){const b=pick(MISSION_POOL);S.daily.push({...b,done:false})}
    save();
  }
  S.daily.forEach(m=>{
    const d=document.createElement('div');
    d.className='mRow'+(m.done?' done':'');
    d.innerHTML='<b>'+m.name+'</b><div class="track"><div class="fill n" style="width:'+(m.done?100:0)+'%"></div></div><span>REWARD ◈'+m.cr+' · '+m.need+'</span>';
    if(!m.done){
      const b=document.createElement('button');b.textContent='SET ACTIVE';
      b.onclick=()=>{mission={...m,need:m.need,done:false};missionProg=0;
        H.mName.textContent=m.name;H.mTxt.textContent='0 / '+m.need;H.mBar.style.width='0%';
        $('#missionsPanel').classList.remove('on');toast('MISSION SET')};
      d.appendChild(b);
    }
    l.appendChild(d);
  });
}

resize();
mountPlayer();
renderGarage();
$('#menu').classList.add('on');
palAt(W.tod);
camera.position.set(0,3,9);
camera.lookAt(0,1,0);
}
</script>
